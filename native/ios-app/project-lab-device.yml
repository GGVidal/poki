# Experimental Poki Lab for a test device signed with a wildcard development profile (issue #689):
# no packet tunnel, no widget extension and no app group, so no explicit App ID is needed. Live
# Activities do not show in this build. Never an alpha, beta, pre-alpha or release build.
# Generate with: xcodegen generate --spec native/ios-app/project-lab-device.yml
include: project-base.yml
name: PokiLabDevice
settings:
  base:
    POKI_BUNDLE_ID: nz.zheha.poki.lab
    POKI_APP_GROUP: ""
    POKI_DISPLAY_NAME: Poki Lab
targets:
  Poki:
    # No app-group entitlement: that is what would need an explicit App ID. `:REPLACE` keeps
    # XcodeGen from merging these with project-base.yml's values instead of replacing them.
    entitlements:REPLACE:
      path: Poki/PokiLabDevice.entitlements
      properties: {}
    # Included arrays are replaced, not appended: the same list as project-base.yml without PokiWidgets.
    dependencies:REPLACE:
      - package: PokiCore
      - package: WebRTC
      - package: PiSwift
        product: PiSwiftAgent
      - package: PiSwift
        product: PiSwiftAI
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) POKI_APP POKI_EXPERIMENTS
        GCC_PREPROCESSOR_DEFINITIONS: $(inherited) POKI_EXPERIMENTS=1
        OTHER_SWIFT_FLAGS: $(inherited) -Xcc -DPOKI_EXPERIMENTS=1
schemes:
  Poki:
    build:
      targets:
        Poki: all
        PokiWidgets: none
        PokiTests: [test]
