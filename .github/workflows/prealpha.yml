# Pre-alpha: every merge into main is built and published to the Pre-alpha channel, with no tag to
# push and no step to wait for. One macOS job does it all (version, build, tag, publish), because
# each extra job costs a runner pickup. Beside it, the app tests (ios-app.yml) and Poki Setup's core
# tests run on the same commit; a run where any of them fails cannot be promoted to Beta
# (.github/scripts/promotion.py checks these jobs by id). It runs on main so that the caches it saves are the ones
# every later run can read; a run from a tag could only read main's caches, and main had none, so
# every release build used to start cold (about 20 minutes, 9 of them in PiSwiftAI).
#
# The build number is the commit count of the source commit, on main or the hotfix branch.
# Tag: app-<VERSION>-prealpha.<count>; release: the rolling app-prealpha-latest, mirrored to the old
# ios-prealpha-latest for Poki Setup 0.2.2 and earlier (docs/release-channels.md).
name: Pre-alpha
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Hotfix Pre-alpha {0}', inputs.version) || '' }}

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', '.github/ISSUE_TEMPLATE/**', '.github/channels.json']
  # Dispatch from main so the workflow and publisher come from the trusted branch.
  workflow_dispatch:
    inputs:
      ref:
        description: "Hotfix branch to build (hotfix/...)"
        type: string
        required: true
      version:
        description: "App version (X.Y.Z)"
        type: string
        required: true

# Hotfixes publish versioned releases in a separate queue. Pushes to main serialize only the build
# job below so a previous build's tests never hold up the next merge.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'prealpha-hotfix' || format('prealpha-run-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prealpha:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # One pre-alpha build at a time. A merge that lands while one builds waits; if several land, only
    # the newest waits and the ones in between are skipped (each build includes them). Only this job
    # waits, so the tests of the last build never hold up the next one.
    concurrency:
      group: prealpha
      cancel-in-progress: false
    permissions:
      contents: write
    # The Xcode 27 image: the iOS 27.1 SDK or later, which the iPhone Duo needs (build-ipa).
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        # Every commit (for the count) but no file contents beyond this one.
        with: { fetch-depth: 0, filter: 'tree:0' }

      - id: v
        name: Version and build number
        run: |
          set -euo pipefail
          VERSION="$(tr -d ' \n' < native/ios-app/VERSION)"
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::native/ios-app/VERSION is not X.Y.Z"; exit 1; }
          BUILD="$(git rev-list --count HEAD)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Poki $VERSION ($BUILD) from $(git log -1 --format='%h %s')"

      - id: build
        uses: ./.github/actions/build-ipa
        with:
          version: ${{ steps.v.outputs.version }}
          build: ${{ steps.v.outputs.build }}
          editions: external

      # Kept 90 days: a beta promoted later copies this exact file (publish-promotion.yml).
      - uses: actions/upload-artifact@v4
        with:
          name: Poki-unsigned
          path: out/
          if-no-files-found: error
          retention-days: 90

      - name: Publish to app-prealpha-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/publish-rolling.sh prealpha "${{ steps.v.outputs.version }}" "${{ steps.v.outputs.build }}" out

      # After publishing, so saving never delays the release, but also when publishing fails, so a
      # re-run starts warm. Same paths as the build-ipa action.
      - if: always() && steps.build.outcome == 'success' && steps.build.outputs.rust-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            native/launcher/target
          key: ${{ steps.build.outputs.rust-key }}
      - if: always() && steps.build.outcome == 'success' && steps.build.outputs.codex-voice-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/codex-voice/aarch64-apple-ios/target/aarch64-apple-ios/release/libpoki_codex_voice.a
            build/codex-voice/aarch64-apple-ios/target/aarch64-apple-ios/release/libpoki_codex_voice.a.sha256
          key: ${{ steps.build.outputs.codex-voice-key }}
      - if: always() && steps.build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            build/app-external
            build/app-local
            ~/Library/Developer/Xcode/DerivedData/ModuleCache.noindex
          key: ipa-xcode27-${{ github.sha }}

      - name: Summary
        if: always()
        run: |
          echo "## Poki v${{ steps.v.outputs.version }} (${{ steps.v.outputs.build }}) Pre-alpha" >> "$GITHUB_STEP_SUMMARY"
          echo "Rust library from cache: ${{ steps.build.outputs.rust-hit || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Codex Voice library from cache: ${{ steps.build.outputs.codex-voice-hit || 'false' }}" >> "$GITHUB_STEP_SUMMARY"

  # The tests a build passes before it can be promoted: PokiCore and loopback tests, the in-process
  # field, apps and idle-cycle checks, the simulator smoke test with every screen, the app unit tests,
  # and Poki's agent end to end with a scripted model. Three macOS jobs, on the same commit (main or
  # the resolved hotfix commit), after the build publishes, so a build skipped for a newer merge takes
  # no macOS runner for its tests. They do not hold up publishing to Pre-alpha; they decide whether
  # this build can go to Beta. promotion.py checks them by job id ("app-tests / <job>", "setup-tests"),
  # so renaming one means renaming it there.
  app-tests:
    needs: [prealpha, resolve-hotfix, build-hotfix, publish-hotfix]
    if: ${{ !cancelled() && (needs.prealpha.result == 'success' || needs.publish-hotfix.result == 'success') }}
    uses: ./.github/workflows/ios-app.yml
    with:
      ref: ${{ needs.resolve-hotfix.outputs.sha }}
      version: ${{ needs.resolve-hotfix.outputs.version }}
      build: ${{ needs.build-hotfix.outputs.build }}
      skip_ipa_upload: true

  # Poki Setup's core (release picking, pairing, signing) on Linux.
  setup-tests:
    needs: [prealpha, resolve-hotfix, publish-hotfix]
    if: ${{ !cancelled() && (needs.prealpha.result == 'success' || needs.publish-hotfix.result == 'success') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.resolve-hotfix.outputs.sha }}" }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: desktop }
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo test -p poki-setup-core -p poki-setup-cli --manifest-path desktop/Cargo.toml
        env: { POKI_SETUP_FILE_SECRETS: "1" }

  resolve-hotfix:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.ref }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$SOURCE_REF" != hotfix/?* ]] || ! git check-ref-format "refs/heads/$SOURCE_REF"; then
            echo "::error::ref must be a hotfix/ branch"; exit 1
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must be X.Y.Z"; exit 1; }
          encoded_ref="$(jq -nr --arg ref "$SOURCE_REF" '$ref | split("/") | map(@uri) | join("/")')"
          sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$encoded_ref" |
            jq -er --arg ref "refs/heads/$SOURCE_REF" 'select(.ref == $ref and .object.type == "commit") | .object.sha')"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::hotfix branch did not resolve to a commit"; exit 1; }
          { echo "sha=$sha"; echo "version=$VERSION"; } >> "$GITHUB_OUTPUT"
          printf '## Poki v%s Pre-alpha from %s at `%s`\n' "$VERSION" "$SOURCE_REF" "$sha" >> "$GITHUB_STEP_SUMMARY"

  build-hotfix:
    needs: resolve-hotfix
    outputs:
      build: ${{ steps.number.outputs.build }}
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-hotfix.outputs.sha }}
          fetch-depth: 0
          filter: 'tree:0'
          persist-credentials: false
      - name: Count hotfix commits
        id: number
        run: |
          set -euo pipefail
          if [ "$(git rev-parse --is-shallow-repository)" != false ]; then
            echo "::error::Hotfix build numbering requires full Git history."
            exit 1
          fi
          build="$(git rev-list --count HEAD)"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Hotfix build: $build" >> "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/build-ipa
        with:
          version: ${{ needs.resolve-hotfix.outputs.version }}
          build: ${{ steps.number.outputs.build }}
          editions: external
      - uses: actions/upload-artifact@v4
        with:
          name: Poki-unsigned
          path: out/
          if-no-files-found: error
          retention-days: 90
          overwrite: true

  publish-hotfix:
    needs: [resolve-hotfix, build-hotfix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
          ref: ${{ needs.resolve-hotfix.outputs.sha }}
          fetch-depth: 0
          filter: 'tree:0'
      - uses: actions/checkout@v4
        with:
          path: pipeline
          ref: ${{ github.sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Poki-unsigned
          path: app
      - name: Verify and record the hotfix IPA
        working-directory: app
        env:
          SOURCE_SHA: ${{ needs.resolve-hotfix.outputs.sha }}
          VERSION: ${{ needs.resolve-hotfix.outputs.version }}
          BUILD: ${{ needs.build-hotfix.outputs.build }}
        run: |
          set -euo pipefail
          (cd ../source && test "$(git rev-parse HEAD)" = "$SOURCE_SHA")
          sha256sum -c SHA256SUMS
          python3 ../pipeline/.github/scripts/verify-ipa-version.py Poki-external-unsigned.ipa "$VERSION" "$BUILD"
          ipa_sha="$(sha256sum Poki-external-unsigned.ipa | cut -d ' ' -f 1)"
          jq -n --arg sha "$SOURCE_SHA" --arg version "$VERSION" --arg build "$BUILD" --arg ipa "$ipa_sha" \
            '{sha: $sha, version: $version, build: $build, ipa_sha256: $ipa}' > "$RUNNER_TEMP/poki-hotfix-source.json"
      - uses: actions/upload-artifact@v4
        with:
          name: Poki-hotfix-source
          path: ${{ runner.temp }}/poki-hotfix-source.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true
      - name: Publish the versioned hotfix Pre-alpha
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve-hotfix.outputs.version }}
          BUILD: ${{ needs.build-hotfix.outputs.build }}
        run: ../pipeline/.github/scripts/publish-rolling.sh prealpha "$VERSION" "$BUILD" ../app --versioned
