name: BackgroundAXProbe
options:
  bundleIdPrefix: local.pokimcp.axprobe
  deploymentTarget:
    iOS: '17.0'
targets:
  Fixture:
    type: application
    platform: iOS
    sources: [FixtureSources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.pokimcp.axprobe.fixture
        PRODUCT_NAME: AXProbeFixture
        SWIFT_VERSION: '5.0'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: '1'
        CODE_SIGNING_ALLOWED: NO
  ProbeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ProbeUITests]
    dependencies:
      - target: Fixture
    settings:
      base:
        TEST_TARGET_NAME: Fixture
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: '5.0'
        CODE_SIGNING_ALLOWED: NO
schemes:
  Probe:
    build:
      targets:
        Fixture: all
        ProbeUITests: [test]
    test:
      targets: [ProbeUITests]
