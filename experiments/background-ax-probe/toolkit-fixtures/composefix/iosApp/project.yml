name: ComposeFixHost
options:
  deploymentTarget:
    iOS: '17.0'
targets:
  ComposeFixHost:
    type: application
    platform: iOS
    sources: [App]
    info:
      path: App/Info.plist
      properties:
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.pokimcp.composefix
        PRODUCT_NAME: ComposeFixApp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CADisableMinimumFrameDurationOnPhone: YES
        FRAMEWORK_SEARCH_PATHS: ../build/bin/iosSimulatorArm64/debugFramework
        OTHER_LDFLAGS: -framework ComposeFix -lc++
        CODE_SIGNING_ALLOWED: NO
        SWIFT_VERSION: '5.0'
